name: pet_diary
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  carousel_slider: ^5.1.1
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_svg: ^2.2.1
  google_fonts: ^6.0.0
  path_provider: ^2.0.17
  table_calendar: ^3.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_native_splash:
  image: "lib/src/assets/icon/icon.png"
  color: "#a2ebe8"
  branding_mode: scale
  

  android_12:
    image: "lib/src/assets/icon/icon.png"
    color: "#a2ebe8"
    

  ios: true
  web: false



flutter:
  uses-material-design: true
  assets:
    - lib/src/assets/
    - lib/src/assets/illustrations/
    - lib/src/assets/icon/


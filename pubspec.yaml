name: pet_diary
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  carousel_slider: ^5.1.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_expandable_fab: ^2.5.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_riverpod: ^3.0.3
  flutter_svg: ^2.2.1
  google_fonts: ^6.0.0
  hive_ce: ^2.15.0
  hive_ce_flutter: ^2.3.2
  http: ^1.5.0
  path_provider: ^2.0.17
  shared_preferences: ^2.5.3
  smooth_page_indicator: ^1.2.1
  supabase_flutter: ^2.0.0
  table_calendar: ^3.2.0
  timelines_plus: ^1.0.8

dev_dependencies:
  build_runner: ^2.9.0
  custom_lint: ^0.8.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.10.0
  riverpod_lint: ^3.0.3

flutter_native_splash:
  image: "lib/src/assets/icon/icon.png"
  color: "#a2ebe8"
  branding_mode: scale

  android_12:
    image: "lib/src/assets/icon/icon.png"
    color: "#a2ebe8"

  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - lib/src/assets/
    - lib/src/assets/illustrations/
    - lib/src/assets/icon/
    - .env
